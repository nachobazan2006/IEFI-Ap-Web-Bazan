<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cba.urban - Pedido listo para enviar</title>
    <link rel="stylesheet" href="./recursos/estilos/index.css">
    <link rel="stylesheet" href="./recursos/estilos/confirmaciones.css">
    <script type="module" src="./recursos/js/carrito.js"></script>
</head>
<body>

    <header class="encabezado-principal encabezado-flotante">
        <!-- el checkbox abre el menú en celular sin agregar javascript -->
        <input type="checkbox" id="menu-toggle">
        <label class="boton-menu-inicio" for="menu-toggle" aria-label="Abrir o cerrar menú">
            <img src="./recursos/imagenes/menu-hamburguesa.svg" alt="">
        </label>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html" >Inicio</a></li>
                <li><a href="./catalogo.html" >Catalogo</a></li>
                <li><a href="./ofertas.html" >Ofertas</a></li>
                <li><a href="./contacto.html" >Contacto</a></li>
            </ul>
        </nav>
        <a class="logo-inicio" href="index.html" aria-label="cba.urban, inicio">cba.<span>urban</span></a>
        <form action="./catalogo.html" method="get">
            <label for="buscar-nav">Buscar:</label>
            <input type="search" id="buscar-nav" name="q" placeholder="Buscar prendas...">
            <button type="submit" aria-label="Buscar"></button>
        </form>
        <ul class="acciones-inicio">
            <li><a href="./perfil.html" aria-label="Mi perfil"><img src="./recursos/imagenes/usuario.svg" alt=""></a></li>
            <li><a href="./carrito.html" aria-label="Carrito"><img src="./recursos/imagenes/carrito-de-compras.svg" alt=""><span id="productos-seleccionados">(0)</span></a></li>
        </ul>
    </header>

    <main id="confirmacion-compra" class="contenido-confirmacion">
        <h2>Preparando el pedido</h2>
        <p>Estamos preparando el mensaje para WhatsApp.</p>
    </main>

    
    <footer class="pie-de-pagina-principal">
        <nav aria-label="Enlaces institucionales">
            <ul>
                <li>Política de Privacidad</li>
                <li>Términos y Condiciones</li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li>Sobre Nosotros</li>
                <li>Preguntas Frecuentes</li>
            </ul>
        </nav>
        <p>&copy; 2026 cba.urban. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
